# Tabular offline path. This workflow does not train PPO and does not install
# the deep-agent stack. That path lives in ppo.yml (workflow_dispatch only).
name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The suite imports src/, which imports numpy (declared in requirements.txt).
      - run: python -m pip install -r requirements.txt pytest
      - name: Tabular tests and drift check (no PPO)
        run: python -m pytest tests -q
